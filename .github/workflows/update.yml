name: update CDS data

on:
  schedule:
    # every 30 min during US trading hours (13:00-22:30 UTC), weekdays
    - cron: "0,30 13-22 * * 1-5"
    # once after the US close to pick up late-reported trades
    - cron: "45 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cds-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the last 10 days
        run: python scripts/build_data.py

      - name: Commit if the data moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/cds.json
          git diff --quiet --staged && echo "no change" && exit 0
          git commit -m "data: refresh CDS spreads"
          git push
